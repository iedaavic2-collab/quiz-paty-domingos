<style>
/* Layout: uma tela = uma altura de celular (base técnica do quiz Wesley/Home Sales).
   Identidade da Paty Domingos: verde-floresta do Clube Organizadas, off-white rosado, dourado nos destaques,
   títulos em serifa (Playfair) como no feed dela; verde-dinheiro só para valores em R$.
   Tema único claro, escolhido de propósito (todas as cores declaradas, fundo explícito). */
:root {
  color-scheme: light;
  --bg: #fdfbfa;
  --ink: #1d2a24;
  --muted: #66706b;
  --line: #e7e1dd;
  --soft: #f4efec;
  --verde: #24362d;
  --verde-soft: #eef2ef;
  --ouro: #b98b3e;
  --ouro-soft: #fbf4e6;
  --money: #15803d;
  --money-soft: #ecfdf3;
  --money-line: #bbf7d0;
  --alert: #c2410c;
  --alert-soft: #fff4ee;
  --alert-line: #fed7c3;
  --navy: #24362d;
  --navy-soft: #eef2ef;
  --ph-bg: #f7f4f1;
  --ph-line: #c9bdb4;
  --display: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --gap: clamp(8px, 1.6dvh, 14px);
  --pad: clamp(9px, 1.7dvh, 14px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--muted); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
.app { height: 100%; max-width: 480px; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; }

.top { flex: none; display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 8px; padding-block: clamp(6px, 1.4dvh, 12px); }
.back { width: 32px; height: 32px; border: 0; background: transparent; color: var(--ink); font-size: 20px; cursor: pointer; border-radius: 8px; }
.back:disabled { visibility: hidden; }
.back:focus-visible, .opt:focus-visible, .pic:focus-visible, .cta:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--verde); border-radius: 99px; transition: width .35s ease; }

main { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); padding-bottom: 12px; overflow: hidden; animation: in .28s ease both; }
.screen > * { flex: none; }
.screen > .fill { flex: 1 1 0; min-height: 110px; }
.pics.four.fill { min-height: 190px; }
.pics.two.fill { min-height: clamp(200px, 38dvh, 440px); }
.screen.center-y { justify-content: center; }

.banner { background: var(--ouro-soft); color: #7a5520; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; padding: 6px 10px; border-radius: 8px; }
h1 { color: var(--ink); font-family: var(--display); font-size: clamp(22px, 4dvh, 32px); line-height: 1.1; font-weight: 900; letter-spacing: -.01em; text-transform: uppercase; text-align: center; margin: 0; text-wrap: balance; }
h2 { color: var(--ink); font-family: var(--display); font-size: clamp(18px, 3dvh, 22px); line-height: 1.22; font-weight: 700; text-align: center; margin: 0; text-wrap: balance; }
.sub { text-align: center; font-size: clamp(12px, 1.9dvh, 14px); font-weight: 800; text-transform: uppercase; color: #4b5563; margin: 0; text-wrap: balance; }
.hint { text-align: center; font-size: 13px; margin: -4px 0 0; }
.go { text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
.hl-money { color: var(--money); white-space: nowrap; }
.hl-ouro { color: var(--ouro); }
.sub-renda { color: var(--ink); font-size: clamp(15px, 2.5dvh, 19px); text-transform: none; font-weight: 800; line-height: 1.3; }
.sub u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.lead { color: var(--ink); font-size: clamp(13px, 2dvh, 15px); text-align: center; margin: 0; text-wrap: pretty; }
.badge { align-self: center; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--verde); background: var(--verde-soft); padding: 4px 9px; border-radius: 6px; }

.opts { display: grid; gap: clamp(6px, 1.1dvh, 10px); }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: var(--pad) 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .1s; }
.opt:hover { border-color: #b9aea6; }
.opt:active { transform: scale(.99); }
.opt.on { border-color: var(--verde); box-shadow: 0 0 0 1px var(--verde); background: var(--verde-soft); }
.opt .em { font-size: 20px; width: 26px; text-align: center; flex: none; }
.opt .tx { min-width: 0; }
.opt .tx small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }

.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pics.two { grid-template-rows: minmax(0, 1fr); }
.pics.four { grid-template-rows: repeat(2, minmax(0, 1fr)); }
.pic { display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; border-radius: 14px; border: 1px solid #4b5563; box-shadow: 0 4px 0 #4b5563; background: #fff; cursor: pointer; font: inherit; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
.pic:hover { border-color: #b9aea6; }
.pic.on { border-color: var(--verde); box-shadow: 0 0 0 1px var(--verde); }
.pic .ph-img { flex: 1 1 0; min-height: 0; background: var(--soft); }
.pic img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 28%; }
.pic .lbl { flex: none; padding: clamp(10px, 1.9dvh, 16px) 8px; font-size: 16px; font-weight: 500; text-align: center; background: #030712; color: #fff; }

.media { border-radius: 12px; overflow: hidden; background: var(--verde); }
.media img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
/* prints: a moldura acompanha o tamanho do print, sem faixa branca em volta */
.media.doc { background: none; border: 0; border-radius: 0; display: flex; align-items: center; justify-content: center; min-height: 0; }
.media.doc img { width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: unset; border: 1px solid var(--line); border-radius: 12px; }
.media.rosto img { object-position: 50% 18%; }
.media.vid { background: #000; position: relative; }
.media.vid video { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; }
.media.vid.contain { flex: none; aspect-ratio: 16 / 9; }
.media.vid.contain video { object-fit: cover; object-position: 50% 50%; }
.unmute { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); border: 0; border-radius: 999px; background: rgba(29, 42, 36, .82); color: #fff; font: inherit; font-size: 13px; font-weight: 700; padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo > * { min-height: 0; height: 100%; }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vs-col { display: grid; gap: 3px; align-content: start; border-radius: 10px; padding: clamp(8px, 1.4dvh, 12px) 11px; font-size: 12.5px; color: var(--ink); }
.vs-col b { font-size: 13px; margin-bottom: 2px; }
.vs-col big { font-size: clamp(22px, 3.6dvh, 28px); font-weight: 900; line-height: 1.1; }
.vs-col.bad { background: #fff4ee; border: 1px solid #fed7c3; }
.vs-col.bad big { color: var(--alert); }
.vs-col.good { background: var(--money-soft); border: 1px solid var(--money-line); }
.vs-col.good big { color: var(--money); }
.calc { display: grid; justify-items: center; gap: 4px; border: 2px solid var(--money); border-radius: 14px; padding: clamp(12px, 2.4dvh, 20px) 14px; text-align: center; background: #fff; }
.calc span { color: var(--ink); font-size: clamp(24px, 4.4dvh, 34px); font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.calc small { font-size: 13px; color: var(--muted); }
.load { display: grid; gap: 8px; }
.load-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink); }
.load-top b { font-variant-numeric: tabular-nums; }
.load-bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.load-bar i { display: block; height: 100%; width: 0; background: var(--money); border-radius: 99px; }
.lead-form { display: grid; gap: 10px; }
.lead-form label { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.lead-form input { font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid #cfc8c3; border-radius: 10px; padding: 11px 12px; width: 100%; }
.lead-form input:focus { outline: 2px solid var(--verde); outline-offset: 1px; border-color: var(--verde); }
.err { margin: 0; color: var(--alert); font-size: 13px; font-weight: 600; }
.selo { background: var(--money); color: #fff; font-weight: 800; font-size: clamp(13px, 2.1dvh, 16px); line-height: 1.25; text-align: center; padding: clamp(9px, 1.6dvh, 13px) 14px; border-radius: 12px; text-wrap: balance; }
.ad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ad-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 10px; background: #fff; }
.ad-col.good { border-color: var(--money); box-shadow: 0 0 0 1px var(--money); }
.who { position: relative; flex: 1 1 0; min-height: 64px; border-radius: 8px; overflow: hidden; background: var(--soft); }
.who img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; }
.who.bad::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(124, 45, 18, .5), rgba(124, 45, 18, 0) 55%); }
.who.good::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(20, 83, 45, .55), rgba(20, 83, 45, 0) 55%); }
.who .cap { position: absolute; z-index: 1; left: 6px; right: 6px; bottom: 6px; color: #fff; font-size: 11px; font-weight: 700; line-height: 1.2; text-align: center; }
.cmp-h { font-size: 12px; text-align: center; padding: 5px; border-radius: 6px; }
.cmp-h.bad { background: #fff4ee; color: var(--alert); }
.cmp-h.good { background: var(--money-soft); color: var(--money); }
.br { display: grid; gap: 3px; font-size: 11.5px; color: var(--ink); }
.br-t { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
.br-t i { display: block; height: 100%; border-radius: 99px; }
.br-t i.bad { background: var(--alert); }
.br-t i.good { background: var(--money); }
.said li { align-items: center; }
.said .ck { font-size: 18px; width: 24px; text-align: center; }
.ba { display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; }
.ba-row { display: grid; grid-template-columns: minmax(0, 36%) 1fr; gap: 10px; align-items: stretch; border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-height: 0; }
.ba-row.bad { background: #fff4ee; border-color: #fed7c3; }
.ba-row.good { background: var(--money-soft); border-color: var(--money); }
.ba-pic { position: relative; border-radius: 8px; overflow: hidden; min-height: 0; }
.ba-pic img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
.ba-pic span { position: absolute; left: 6px; top: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: #fff; padding: 3px 7px; border-radius: 5px; }
.bad .ba-pic span { background: var(--alert); } .good .ba-pic span { background: var(--money); }
.ba-arrow { text-align: center; font-size: 12px; font-weight: 700; color: var(--money); }
.ba-list { list-style: none; margin: 0; padding: 0; display: grid; align-content: center; gap: clamp(4px, 1dvh, 10px); min-width: 0; }
.ba-list li { position: relative; padding-left: 22px; font-size: clamp(12px, 1.9dvh, 14.5px); line-height: 1.3; color: var(--ink); }
.ba-list.x li::before { content: "✕"; position: absolute; left: 2px; top: 0; color: var(--alert); font-weight: 800; }
.ba-list.ok li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 4px; background: var(--money); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.rot { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: r; }
.rot li { counter-increment: r; display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: clamp(9px, 1.6dvh, 13px) 12px; color: var(--ink); background: #fff; }
.rot li::before { content: counter(r); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--verde); color: #fff; font-weight: 800; }
.rot li b { font-size: 15px; }
.rot li span { font-size: 12.5px; color: var(--muted); }
.rot li.me { border-color: var(--money); box-shadow: 0 0 0 1px var(--money); background: var(--money-soft); }
.rot li.me::before { background: var(--money); }
.trilha { display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); border-left: 3px solid var(--line); margin-left: 10px; padding-left: 18px; }
.tr-step { position: relative; display: grid; align-content: center; gap: 1px; }
.tr-step i { position: absolute; left: -27px; top: 50%; width: 15px; height: 15px; margin-top: -8px; border-radius: 50%; background: var(--bg); border: 3px solid var(--verde); }
.tr-step b { color: var(--ink); font-size: 14px; }
.tr-step span { font-size: 12px; }
.tr-step.goal i { background: var(--money); border-color: var(--money); }
.tr-step.goal b { color: var(--money); }
/* tela da faxina: comparação à esquerda, print alto da aluna à direita, ocupando a altura livre */
.tela-faxina { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); }
.pilha { display: grid; gap: 8px; align-content: start; min-height: 0; overflow: hidden; }
.quote.mini { font-size: clamp(12px, 1.8dvh, 13.5px); padding: 10px 11px; }
.quote.mini cite { margin-top: 4px; }
/* tela da faxina v2: comparação em uma linha e o print em largura total, cortado no topo para o texto ficar legível */
.troca { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.troca span { display: grid; gap: 1px; text-align: center; border-radius: 10px; padding: 8px 6px; }
.troca small { font-size: 11px; font-weight: 600; line-height: 1.2; }
.troca b { font-size: clamp(20px, 3.2dvh, 26px); font-weight: 900; line-height: 1.1; }
.troca .t-bad { background: var(--alert-soft); border: 1px solid var(--alert-line); color: var(--alert); }
.troca .t-good { background: var(--money-soft); border: 1px solid var(--money-line); color: var(--money); }
.troca i { font-style: normal; font-weight: 900; color: var(--money); font-size: 20px; }
.screen > .media.print-hero { min-height: 40dvh; }
.media.print-hero { position: relative; background: #f2efe9; border: 1px solid var(--line); }
.media.print-hero img { object-fit: cover; object-position: 50% 0%; }
.media.print-hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 30%; background: linear-gradient(to top, #f2efe9 18%, rgba(242, 239, 233, 0)); }
.print-tag { position: absolute; z-index: 1; left: 10px; bottom: 10px; background: var(--verde); color: #fff; font-size: 11.5px; font-weight: 700; padding: 5px 9px; border-radius: 6px; }
/* vídeo curto da Paty com legenda própria (a legenda original fica numa trilha que o navegador não mostra) */
.gancho-duo { grid-template-columns: 46% minmax(0, 1fr); align-items: stretch; min-height: 40dvh; }
.media.gancho { height: 100%; min-height: 0; }
.media.gancho video { object-fit: cover; object-position: 50% 50%; }
.gancho-facts { align-content: center; gap: 6px; min-height: 0; overflow: hidden; }
.gancho-facts li { font-size: clamp(11.5px, min(2.1dvh, 3.7vw), 16px); line-height: 1.3; padding: 10px 10px; gap: 7px; }
.gancho-facts li b { display: block; font-size: 1.12em; white-space: nowrap; }
.echo.ponte { font-size: clamp(14px, 2.2dvh, 16px); }
.legenda { position: absolute; left: 10px; right: 10px; bottom: 12px; text-align: center; color: #fff; font-weight: 800; font-size: clamp(12.5px, 2dvh, 15px); line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,.6); background: rgba(29, 42, 36, .55); border-radius: 8px; padding: 6px 8px; pointer-events: none; }
.media.gancho .unmute { bottom: auto; top: 10px; }
/* entrada: 4 cards de idade no formato do modelo enviado (rótulo claro, borda bege) */
.pics.idade .pic { border: 1.5px solid #e7ddd0; border-radius: 16px; box-shadow: none; }
.pics.idade .pic.on { border-color: var(--ouro); box-shadow: 0 0 0 1px var(--ouro); }
.pics.idade .pic img { object-position: 50% 30%; }
.pics.idade .pic .lbl { background: #fff; color: var(--ink); font-weight: 800; font-size: clamp(13px, 2dvh, 16px); padding: clamp(8px, 1.5dvh, 13px) 6px; }
/* versão "antes" da avatar: mesma foto, apagada */
.who.bad img, .ba-row.bad .ba-pic img, .v-pic.antes img { filter: grayscale(.85) brightness(.92) contrast(.95); }
/* tela 12: foto deitada da Paty apontando, em largura total, números lado a lado */
.media.paty-aponta { background: #cfcbd6; }
.media.paty-aponta img { object-position: 62% 20%; }
.gancho-facts.lado { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.gancho-facts.lado li { min-width: 0; font-size: clamp(11px, min(2.1dvh, 3.5vw), 15px); }
/* resultado (diagnóstico) */
.res-card { display: grid; gap: 4px; text-align: center; background: var(--verde); color: #fff; border-radius: 14px; padding: clamp(10px, 1.8dvh, 16px) 14px; }
.res-k { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #cfdcd4; }
.res-nome { font-size: clamp(22px, 3.6dvh, 28px); font-weight: 900; line-height: 1.1; color: #fff; }
.res-frase { font-size: clamp(12.5px, 1.9dvh, 14px); color: #e7efe9; }
.res-meter { display: grid; gap: 5px; margin-top: 6px; text-align: left; }
.res-meter-top { display: flex; justify-content: space-between; font-size: 12px; color: #e7efe9; }
.res-meter-top b { color: #fff; font-size: 15px; font-variant-numeric: tabular-nums; }
.res-bar { height: 9px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; }
.res-bar i { display: block; height: 100%; background: linear-gradient(90deg, #d8b26a, #f1d79c); border-radius: 99px; }
.res-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.res-pic { position: relative; margin: 0; border-radius: 12px; overflow: hidden; min-height: 0; }
.res-pic img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.res-pic.antes img { filter: grayscale(.85) brightness(.92); }
.res-pic figcaption { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 1px; padding: 18px 8px 8px; text-align: center; color: #fff; }
.res-pic.antes figcaption { background: linear-gradient(to top, rgba(124,45,18,.85), rgba(124,45,18,0)); }
.res-pic.depois figcaption { background: linear-gradient(to top, rgba(20,83,45,.9), rgba(20,83,45,0)); }
.res-pic small { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.res-pic b { font-size: clamp(12px, 1.9dvh, 14px); line-height: 1.2; }
.res-pot { display: grid; gap: 2px; text-align: center; border: 2px solid var(--money); background: var(--money-soft); border-radius: 12px; padding: clamp(8px, 1.4dvh, 12px); }
.res-pot small { font-size: 12.5px; color: var(--ink); }
.res-pot b { font-size: clamp(19px, 3dvh, 24px); font-weight: 900; color: var(--money); font-variant-numeric: tabular-nums; }
.diag { display: grid; gap: 4px; border-radius: 12px; padding: clamp(9px, 1.6dvh, 13px) 13px; border: 1px solid var(--line); background: #fff; }

.w32-p { margin: 0; color: var(--ink); font-size: clamp(12.5px, 1.95dvh, 15px); line-height: 1.4; text-align: center; text-wrap: pretty; }
.w32-e { font-size: clamp(12.5px, 1.95dvh, 14px); line-height: 1.4; }
.pl-h1 { color: var(--ink); font-size: clamp(20px, 5.4vw, 24px); line-height: 1.25; font-weight: 800; margin: 4px 0 0; text-wrap: balance; }
.pl-p { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.55; }
.pl-lead { margin: 0; color: var(--ink); font-size: 16px; font-weight: 800; }
.pl-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: pl; }
.pl-step { counter-increment: pl; position: relative; display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 14px 56px; }
.pl-step::before { content: counter(pl); position: absolute; left: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font-weight: 800; font-size: 14px; }
.pl-step b { color: var(--ink); font-size: 15px; line-height: 1.3; }
.pl-step span { font-size: 13.5px; line-height: 1.5; }
.pl-step.hot { border-color: var(--money); box-shadow: 0 0 0 1px var(--money); background: var(--money-soft); }
.pl-step.hot::before { background: var(--money); }
.pl-step .pl-tag { justify-self: start; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--money); padding: 3px 8px; border-radius: 999px; line-height: 1.4; }
.pl-dream { border-radius: 14px; padding: 16px; background: var(--navy); color: #dfe5f3; display: grid; gap: 6px; }
.pl-dream b { color: #fff; font-size: 17px; line-height: 1.3; }
.pl-dream p { margin: 0; font-size: 14px; line-height: 1.55; }
.pl-end { margin: 0; text-align: center; color: var(--ink); font-size: 16px; font-weight: 800; text-wrap: balance; }
.pl-res { display: grid; gap: 8px; border: 2px solid var(--money); background: var(--money-soft); border-radius: 14px; padding: 14px; }
.pl-res-k { justify-self: start; background: var(--money); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; }
.pl-res b { color: var(--ink); font-size: 17px; line-height: 1.3; }
.pl-res ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; color: #14532d; font-size: 13.5px; font-weight: 600; }
.pl-fig { margin: 0; display: grid; gap: 8px; }
.pl-fig img { display: block; width: 100%; height: clamp(150px, 26dvh, 260px); object-fit: cover; object-position: 50% 20%; border-radius: 14px; }
.pl-fig figcaption { font-size: 12.5px; line-height: 1.45; text-align: center; color: var(--muted); }
.pl-fig figcaption b { color: var(--ink); }
.v-brand small:last-child { margin-top: 4px; }
.media.vid.sv { aspect-ratio: 9 / 14; max-height: 70dvh; }
.v-apoio { text-align: left; background: var(--navy-soft); border-color: var(--navy) !important; }
.v-apoio b { text-align: center; }
.v-apoio ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--ink); }
.v-apoio small { text-align: center; }
.v-bn small s, .v-stack b, .v-total s { color: var(--alert); }
.v-total { margin: 0; text-align: center; color: var(--ink); font-size: 17px; font-weight: 800; }
.rot.rot-ico li { grid-template-columns: clamp(42px, 8.5dvh, 92px) 1fr; column-gap: 12px; padding: clamp(8px, 1.4dvh, 12px) 12px; }
.rot.rot-ico li::before { display: none; }
.rot.rot-ico li img { grid-row: span 2; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; display: block; }
.rot.rot-ico li b { align-self: end; }
.rot.rot-ico li span { align-self: start; }
@media (max-height: 600px) { .rot.rot-ico li { grid-template-columns: 1fr; } .rot.rot-ico li img { display: none; } }

/* ===== Página de vendas no formato da página do Pablo (Mente Milionária) ===== */
.mm-h1 { color: var(--ink); font-size: clamp(22px, 6.4vw, 28px); line-height: 1.15; font-weight: 800; text-transform: uppercase; text-align: center; margin: 4px 0 0; text-wrap: balance; }
.mm-ad { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; row-gap: 10px; }
.mm-ad-h { text-align: center; font-size: 22px; font-weight: 800; }
.mm-ad-h.bad { color: var(--alert); } .mm-ad-h.good { color: var(--money); }
.lv { display: grid; gap: 2px; color: var(--ink); }
.lv b { font-size: 13.5px; } .lv span { font-size: 13px; color: var(--muted); }
.lv-t { position: relative; display: block; height: 8px; border-radius: 99px; background: var(--line); margin: 6px 0 4px; }
.lv-t u { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; text-decoration: none; }
.lv-t.bad u { background: var(--alert); } .lv-t.good u { background: var(--money); }
.lv-t s { position: absolute; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: #fff; border: 3px solid #d1d5db; }
.mm-name { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; color: var(--ink); font-size: 24px; font-weight: 800; }
.mm-vid { aspect-ratio: 9 / 13; max-height: 70dvh; border-radius: 14px; }
.mm-sign { margin: 0; text-align: center; color: var(--ink); font-size: 22px; font-weight: 800; font-style: italic; }
.mm-sub { margin: -8px 0 0; text-align: center; color: var(--ink); font-size: 15px; }
.mm-h2 { color: var(--ink); font-size: clamp(19px, 5.4vw, 23px); line-height: 1.2; font-weight: 800; text-align: center; margin: 30px 0 0 !important; text-wrap: balance; }
.mm-h2.bad { color: var(--alert); } .mm-h2.good { color: var(--money); }
.mm-card { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; padding-bottom: 14px; text-align: center; }
.mm-card > img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: 30% 25%; display: block; }
.mm-card > img.mm-face { aspect-ratio: 4 / 3; object-position: 50% 15%; }
.mm-card > b { color: var(--ink); font-size: 17px; font-weight: 800; padding: 10px 14px 0; line-height: 1.25; }
.mm-card > p { margin: 0; padding: 0 14px; font-size: 14px; line-height: 1.5; }
.mm-icons { display: flex; justify-content: center; gap: 10px; padding: 14px 10px 0; }
.mm-icons img { width: 28%; max-width: 110px; aspect-ratio: 1 / 1; object-fit: contain; }
.mm-steps { margin: 0; padding: 0 14px 0 34px; text-align: left; display: grid; gap: 6px; color: var(--ink); font-size: 14px; }
.mm-steps li.hot { font-weight: 700; color: var(--money); }
.mm-steps em { font-style: normal; font-size: 11px; background: var(--money); color: #fff; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
.mm-soft { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; color: #4b5563; font-size: 19px; font-weight: 700; line-height: 1.3; }
.mm-green { background: #16a34a; color: #fff; border-radius: 12px; padding: 18px 14px; text-align: center; font-size: 22px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.mm-lightgreen { background: var(--money-soft); border: 1px solid var(--money-line); border-radius: 12px; padding: 12px; text-align: center; color: var(--money); font-size: 17px; font-weight: 800; }
.mm-red { background: #dc2626; color: #fff; border-radius: 12px; padding: 18px 14px; text-align: center; font-size: 24px; font-weight: 800; line-height: 1.2; margin-top: 28px !important; text-wrap: balance; }
.mm-calm { margin: 0; text-align: center; color: var(--ink); font-size: 20px; font-weight: 800; line-height: 1.3; text-wrap: balance; }
.mm-bh { background: #e8efff; border: 1px solid #c7d6fb; border-radius: 12px; padding: 12px; text-align: center; color: #1d4ed8; font-size: 18px; font-weight: 800; line-height: 1.25; }
.mm-bonus { position: relative; display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; padding-bottom: 16px; text-align: center; margin-top: 8px !important; }
.mm-bonus img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: center top; display: block; }
.mm-bonus b { color: var(--ink); font-size: 21px; font-weight: 800; padding: 12px 14px 0; line-height: 1.2; }
.mm-bonus p { margin: 0; padding: 0 14px; font-size: 14.5px; line-height: 1.5; }
.mm-bl { display: grid; gap: 18px; margin-top: 4px !important; }
.mm-bl article { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: start; }
.mm-bl i { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--brand, #24362d); color: #fff; }
.mm-bl i.gold { background: #b98b3e; }
.mm-bl i svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mm-bl b { display: block; color: var(--ink); font-size: 16.5px; font-weight: 800; line-height: 1.25; }
.mm-bl p { margin: 4px 0 8px; font-size: 14.5px; line-height: 1.5; }
.mm-bl em { font-style: normal; display: inline-block; background: var(--money-soft); color: var(--money); font-weight: 800; font-size: 12px; letter-spacing: .08em; border-radius: 999px; padding: 4px 12px; }
.mm-val { color: var(--alert); font-size: 20px; font-weight: 800; }
.mm-val s { color: var(--alert); }
.mm-tag { position: absolute; top: 10px; left: 10px; font-style: normal; background: var(--money); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; }
.mm-lapis { margin: 28px 0 0 !important; text-align: center; color: var(--ink); font-size: 16px; font-weight: 800; }
.mm-stack { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mm-stack li { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1.5px solid #f87171; border-radius: 12px; padding: 12px 14px; }
.mm-stack b { color: var(--ink); font-size: 13.5px; line-height: 1.3; }
.mm-stack span { flex: none; background: var(--soft); border-radius: 8px; padding: 6px 10px; color: var(--ink); font-weight: 800; font-size: 16px; }
.mm-total { margin: 0; text-align: center; font-size: 40px; font-weight: 800; color: var(--alert); }
.mm-total s { color: var(--alert); }
.mm-porem { margin: 0; text-align: center; color: var(--ink); font-size: 18px; font-weight: 800; line-height: 1.25; text-wrap: balance; }
.mm-pack { width: 100%; margin-top: 8px !important; }
.mm-pack img { display: block; width: 100%; height: auto; }
.mm-price { border: 2px solid #1d4ed8; border-radius: 14px; overflow: hidden; }
.mm-price-h { background: #1d4ed8; color: #fff; text-align: center; font-weight: 800; font-size: 15px; padding: 8px; }
.mm-price-b { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px; }
.mm-price-b > b { color: var(--ink); font-size: 18px; line-height: 1.25; font-weight: 800; }
.mm-price-v { display: grid; justify-items: center; text-align: center; background: var(--soft); border-radius: 10px; padding: 8px 10px; }
.mm-price-v small { font-size: 12px; color: var(--muted); }
.mm-price-v strong { color: var(--ink); font-size: 30px; line-height: 1.1; font-weight: 800; }
.mm-pay { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
.mm-x, .mm-ok { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mm-x li, .mm-ok li { border-radius: 12px; padding: 12px 14px 12px 42px; position: relative; font-size: 15px; line-height: 1.4; color: var(--ink); }
.mm-x li { background: var(--alert-soft); border: 1px solid var(--alert-line); }
.mm-ok li { background: var(--money-soft); border: 1px solid var(--money-line); }
.mm-x li::before { content: "✕"; position: absolute; left: 14px; top: 11px; color: var(--alert); font-weight: 800; font-size: 17px; }
.mm-ok li::before { content: "✓"; position: absolute; left: 12px; top: 10px; width: 20px; height: 20px; border-radius: 5px; background: var(--money); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; }
@media (max-width: 360px) { .mm-price-b { grid-template-columns: 1fr; } }
.mm-price-why { list-style: none; margin: 0; padding: 0 14px 10px; display: grid; gap: 6px; }
.mm-price-why li { position: relative; padding-left: 22px; font-size: 13.5px; line-height: 1.4; color: var(--ink); }
.mm-price-why li::before { content: "✓"; position: absolute; left: 0; top: 0; color: var(--money); font-weight: 800; }
.mm-price-up { margin: 0; background: #fffbeb; border-top: 1px solid #fde68a; color: #92400e; font-size: 12.5px; font-weight: 700; text-align: center; padding: 8px 12px; }
.mm-why { display: grid; gap: 8px; background: var(--navy); color: #dfe5f3; border-radius: 14px; padding: 16px; }
.mm-why b { color: #fff; font-size: 20px; } .mm-why p { margin: 0; font-size: 14.5px; line-height: 1.55; } .mm-why span { justify-self: end; font-style: italic; font-weight: 700; color: #fff; }
.mm-obj { border: 1px solid var(--alert-line); background: var(--alert-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.mm-obj b { color: var(--alert); font-size: 16px; } .mm-obj p { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.45; }
.ba-list { list-style: none; margin: 0; padding: 0; display: grid; align-content: center; gap: clamp(4px, 1dvh, 10px); min-width: 0; }
.ba-list li { position: relative; padding-left: 22px; font-size: clamp(12px, 1.9dvh, 14.5px); line-height: 1.3; color: var(--ink); }
.ba-list.x li::before { content: "✕"; position: absolute; left: 2px; top: 0; color: var(--alert); font-weight: 800; }
.ba-list.ok li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 4px; background: var(--money); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }

@keyframes in { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .bar > i { transition: none; } }
/* sem barra de progresso; na capa (voltar desativado) a linha do topo some */
.top .bar { visibility: hidden; }
.top:has(.back:disabled) { display: none; }
.app:has(.back:disabled) { padding-top: 14px; }

/* ===== Tema Natal que Encanta e Vende: verde-esmeralda, dourado e creme (sobrepõe o tema claro do quiz) ===== */
:root {
  color-scheme: dark;
  --bg: #0b1d14; --ink: #f6f0e2; --muted: #b9c4b9; --line: rgba(222, 186, 106, .26); --soft: #132d20;
  --verde: #e2c07a; --verde-soft: #1d4232; --ouro: #e2c07a; --ouro-soft: rgba(226, 192, 122, .1);
  --money: #6fdc98; --money-soft: rgba(53, 196, 106, .12); --money-line: rgba(111, 220, 152, .4);
  --alert: #ff9a7a; --alert-soft: rgba(255, 138, 101, .1); --alert-line: rgba(255, 138, 101, .35);
  --gold: #e2c07a; --gold-d: #b98e3e;
  --display: "Jost", system-ui, sans-serif; --font: "Jost", system-ui, sans-serif; --serif: "Playfair Display", Georgia, serif;
}
body { background: radial-gradient(110% 60% at 50% 0%, #1a3a29 0%, #0b1d14 70%) fixed, #0b1d14; color: var(--muted); }
.bar { background: rgba(255, 255, 255, .1); }
.bar > i { background: linear-gradient(90deg, #edcd82, #c2942f); }
.back { color: var(--gold); }
h1 { font-family: var(--font); font-weight: 700; text-transform: none; font-size: clamp(24px, 4.2dvh, 32px); }
h1 em, .cv-h1 em { font-family: var(--serif); font-style: italic; color: var(--gold); }
h2 { font-weight: 600; font-size: clamp(19px, 3.1dvh, 23px); }
.sub { color: var(--gold); text-transform: none; font-weight: 500; letter-spacing: .02em; }
.go { color: var(--gold); }
.hint, .lead { color: var(--muted); }
.badge { color: #22180a; background: var(--gold); }
.q-logo { display: block; width: clamp(110px, 17dvh, 150px); height: auto; margin: 0 auto; filter: drop-shadow(0 4px 10px #0008); }
.q-logo.sm { width: 120px; }

.opt { background: #10261b; border-color: var(--line); font-size: 15px; }
.opt:hover { border-color: rgba(226, 192, 122, .6); }
.opt.on { background: #1d4232; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.pic { background: #10261b; border-color: rgba(226, 192, 122, .45); box-shadow: 0 4px 0 #00000080; }
.pic.on { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.pics.idade .pic .lbl, .pic .lbl { background: #08160f; color: var(--ink); }
.media { background: #10261b; }
.media.doc img { border-color: var(--line); }

.echo { background: rgba(226, 192, 122, .1); border-color: rgba(226, 192, 122, .35); color: #e9dcc0; }
.echo b { color: var(--ink); }
.facts li { background: #10261b; border-color: var(--line); }
.quote { background: #1d4232; }
.legal { color: #7f8f84; }
.lead-form label { color: var(--ink); }
.lead-form input { background: #08160f; border-color: rgba(226, 192, 122, .35); color: var(--ink); }
.lead-form input:focus { outline-color: var(--gold); border-color: var(--gold); }
.load-bar { background: rgba(255, 255, 255, .1); }
.load-bar i { background: linear-gradient(90deg, #edcd82, #c2942f); }
.load-top { color: var(--ink); }

.res-card { background: linear-gradient(160deg, #1d4232, #10261b); border: 1px solid rgba(226, 192, 122, .45); }
.res-nome { font-family: var(--serif); font-style: italic; color: var(--gold); font-weight: 700; }
.res-k { color: #cfdcd4; }
.diag { background: #10261b; border-color: var(--line); }
.diag.ok { background: rgba(53, 196, 106, .1); border-color: rgba(111, 220, 152, .35); }
.diag.falta { background: rgba(226, 192, 122, .08); border-color: rgba(226, 192, 122, .3); } .diag.falta .diag-k { color: var(--gold); }
.diag.passo { border-color: var(--gold); } .diag.passo .diag-k { color: var(--gold); }

/* botão do rodapé: dourado com brilho, como na página de vendas */
.cta { position: relative; overflow: hidden; color: #2c1f06; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  background: linear-gradient(100deg, #fcefc4 0%, #edcd82 24%, #dcae4c 54%, #c2942f 100%); border: 1px solid #f6dea4;
  box-shadow: 0 18px 40px -16px #000e, 0 2px 1px #fff7dd inset, 0 0 26px -8px #e0b64f66; }
.cta::after { content: ""; position: absolute; top: 0; left: -130%; width: 48%; height: 100%; transform: skewX(-22deg); background: linear-gradient(100deg, transparent, #ffffffcc, transparent); animation: sheen 5.5s ease-in-out infinite; pointer-events: none; }
@keyframes sheen { 0%, 55% { left: -130%; } 80%, 100% { left: 160%; } }
@media (prefers-reduced-motion: reduce) { .cta::after { animation: none; } }
body:has(.screen.scroll) .cta { background: linear-gradient(100deg, #fcefc4 0%, #edcd82 24%, #dcae4c 54%, #c2942f 100%); font-weight: 700; letter-spacing: .06em; }

/* tela final: convite para a live */
.screen.scroll { overflow-y: auto; gap: 14px; padding-bottom: 24px; }
.cv-h1 { font-size: clamp(26px, 7vw, 32px); text-transform: none; }
.cv-when { align-self: center; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; background: rgba(226, 192, 122, .12); font-size: 15px; color: var(--ink); }
.cv-when i { width: 4px; height: 4px; border-radius: 50%; background: var(--gold-d); }
.cv-when b { color: var(--gold); font-weight: 600; }
.cv-sub { margin: -6px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
.cv-ph { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
.cv-ph img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
.cv-txt { margin: 0; font-size: 15.5px; line-height: 1.55; color: var(--muted); text-align: center; }
.cv-txt b { color: var(--ink); }
.cv-learn { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.cv-learn li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 12px 14px; border-radius: 12px; background: #10261b; border: 1px solid var(--line); color: var(--ink); font-size: 14.5px; }
.cv-learn li i { font-style: normal; font-size: 18px; }
.cv-learn li em { flex-basis: 100%; margin-left: 28px; font-style: normal; font-size: 12px; font-weight: 600; color: var(--money); }
.cv-learn li.hot { border-color: var(--gold); background: #1d4232; }
.cv-price { display: grid; justify-items: center; gap: 2px; padding: 16px; border-radius: 16px; border: 1px solid rgba(226, 192, 122, .5); background: linear-gradient(160deg, #1d4232, #10261b); text-align: center; }
.cv-price small { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.cv-price > b { font-size: 40px; line-height: 1.1; color: var(--ink); font-weight: 700; }
.cv-cd { margin: 4px 0 0; font-size: 13px; color: var(--gold); }
.cv-cd b { color: var(--ink); font-variant-numeric: tabular-nums; }
.cv-grav { margin: 0; text-align: center; font-size: 13.5px; color: var(--muted); }
.cv-grav b { color: var(--ink); }
.cv-h2 { margin-top: 8px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.cv-deps { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 6px; scrollbar-width: none; }
.cv-deps::-webkit-scrollbar { display: none; }
.cv-deps figure { flex: 0 0 80%; scroll-snap-align: center; margin: 0; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: #fff; }
.cv-deps img { display: block; width: 100%; height: 400px; object-fit: contain; object-position: top; background: #fff; }
.cv-deps figcaption { flex: 1; padding: 9px 12px; font-size: 13px; line-height: 1.35; color: #3a3a3a; background: #f4efe3; }
.cv-deps figcaption b { color: #0f2419; }
.cv-sw { margin: -6px 0 0; text-align: center; font-size: 12px; color: var(--gold); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back" id="back" type="button" aria-label="Voltar">&#8592;</button>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
    <span></span>
  </div>
  <main id="app" aria-live="polite"></main>
  <div class="foot" id="foot" hidden><button class="cta" id="cta" type="button">CONTINUAR</button></div>
</div>

<script>
/* ===== CONFIGURAÇÃO ===== */
const CHECKOUT_URL = "";  /* link do checkout do ingresso de R$ 19,90 (Greenn). Vazio = o botão final leva à página de vendas */
const WEBHOOK_URL = "";   /* opcional: recebe o lead do quiz (nome, e-mail, WhatsApp e respostas) em JSON */
const VENDAS_URL = "vendas.html";
const LOTE_FIM = new Date("2026-10-30T23:59:59-03:00").getTime();   /* R$ 19,90 até sexta, 23h59 */

const IMG = n => `../img/${n}`;
const at = id => S.findIndex(x => x.id === id);
const A = {};
const hist = [];

const SIT_ECO = {
  diarista: [`Você já trabalha cuidando de casas. <span class="hl-ouro">No Natal, esse cuidado pode valer muito mais.</span>`, `Muitas famílias <b>pagam para ter a árvore e a mesa da ceia montadas</b> por alguém de confiança.`],
  casa: [`Você já é quem deixa a casa pronta para a família. <span class="hl-ouro">E faz isso de graça.</span>`, `O mesmo cuidado que você tem com o seu Natal <b>é o que muitas famílias pagam para ter</b>.`],
  fora: [`Dá para aproveitar <span class="hl-ouro">os fins de semana de dezembro.</span>`, `Montar árvores e mesas de Natal é <b>um serviço de poucas horas</b>, que cabe na sua agenda.`],
  po: [`Você já é personal organizer. <span class="hl-ouro">O Natal é o seu serviço extra de fim de ano.</span>`, `Montagem de árvore, mesa posta e desmontagem em janeiro: <b>três serviços a mais para oferecer às suas clientes</b>.`],
  busca: [`Existe um serviço <span class="hl-ouro">que quase ninguém sabe que pode oferecer.</span>`, `E ele pode ser <b>a sua renda extra ainda neste fim de ano</b>.`]
};
const OBJ_TXT = { casa: "decorar e organizar o Natal da sua casa", "renda-extra": "descobrir uma renda extra", comecar: "começar a trabalhar com organização", ampliar: "ampliar os seus serviços como personal organizer" };

/* data-drop="N": se a tela não couber na altura do celular, some primeiro o maior N */
const S = [
  /* ================= ABERTURA ================= */
  { n: 1, render: () => `
      <img class="q-logo" src="${IMG("logo-natal-encanta.webp")}" width="620" height="401" alt="Natal que Encanta e Vende">
      <h1>Monte o melhor Natal da sua família. <em>E transforme isso em renda extra.</em></h1>
      <p class="sub" data-drop="2">Faça o teste e descubra o seu perfil para o Natal.</p>
      <div class="go" data-drop="1">↓ RESPONDA PARA COMEÇAR ↓</div>
      <h2>Para começar, qual é a sua idade?</h2>
      <div class="pics four idade fill">
        ${pic("idade", "18-29", "18 a 29 anos", IMG("avatar-18-29.jpg"))}
        ${pic("idade", "29-39", "30 a 39 anos", IMG("avatar-29-39.jpg"))}
        ${pic("idade", "39-49", "40 a 49 anos", IMG("avatar-39-49-v2.jpg"))}
        ${pic("idade", "50+", "50 anos ou mais", IMG("avatar-50.jpg"))}
      </div>` },

  { n: 2, center: true, render: () => `
      <h2>Como é a sua rotina hoje?</h2>
      <div class="opts">
        ${opt("sit", "casa", "🏠", "Cuido da casa e da família")}
        ${opt("sit", "diarista", "🧹", "Faço faxina ou diária em casas de família")}
        ${opt("sit", "fora", "💼", "Trabalho fora de casa")}
        ${opt("sit", "po", "✨", "Já sou personal organizer")}
        ${opt("sit", "busca", "🧭", "Estou buscando uma nova atividade")}
      </div>` },

  { n: 0, id: "espelho", cta: "CONTINUAR", render: () => {
      const T = SIT_ECO[A.sit] || SIT_ECO.busca;
      return `
      <h2>${T[0]}</h2>
      <div class="media rosto fill"><img src="${IMG("paty-natal-v1.jpg")}" alt="Paty Domingos sentada em uma poltrona ao lado de uma árvore de Natal dourada" style="object-position: 50% 22%"></div>
      <div class="echo" data-drop="1">${T[1]}</div>`; } },

  /* ================= O NATAL DELA ================= */
  { n: 3, center: true, render: () => `
      <h2>Como é a montagem da árvore de Natal na sua casa?</h2>
      <div class="opts">
        ${opt("arvore", "amo", "🎄", "Eu mesma monto e amo fazer isso")}
        ${opt("arvore", "nao-fica", "😕", "Eu monto, mas nunca fica como eu queria")}
        ${opt("arvore", "trabalho", "😮‍💨", "Dá muito trabalho, às vezes nem monto")}
        ${opt("arvore", "outra", "🙋‍♀️", "Outra pessoa monta para a família")}
      </div>` },

  { n: 4, center: true, render: () => `
      <h2>O que mais te incomoda no Natal da sua casa?</h2>
      <div class="opts">
        ${opt("dor", "vazia", "🪫", "A árvore fica vazia ou sem graça")}
        ${opt("dor", "mesa", "🍽️", "A mesa da ceia fica simples demais")}
        ${opt("dor", "guardar", "📦", "Guardar os enfeites: sempre quebra ou embola")}
        ${opt("dor", "tempo", "⏳", "Falta de tempo para deixar tudo bonito")}
      </div>` },

  { n: 0, id: "dor-eco", cta: "CONTINUAR", render: () => {
      const T = {
        vazia: [`Árvore vazia <span class="hl-ouro">não é falta de enfeite.</span> É falta de técnica.`, `Existe uma <b>ordem certa</b>: galhos, luzes, enfeites grandes, laços e só depois os pequenos. É isso que dá o efeito de vitrine.`],
        mesa: [`Uma mesa de ceia encantadora <span class="hl-ouro">não precisa de louça cara.</span>`, `Precisa de <b>composição</b>: lugares, travessas, centro de mesa e cor. Tudo isso se aprende.`],
        guardar: [`Enfeite quebrado em janeiro <span class="hl-ouro">é dinheiro jogado fora.</span>`, `Desmontar e guardar com técnica <b>conserva as suas peças por muitos Natais</b>. E também é um serviço que se cobra.`],
        tempo: [`Falta de tempo é <span class="hl-ouro">exatamente o motivo de tanta família pagar</span> para alguém montar o Natal.`, `Com técnica, <b>uma árvore fica pronta em poucas horas</b>. E bem mais bonita.`]
      }[A.dor] || [`O Natal mais bonito <span class="hl-ouro">começa pela técnica.</span>`, `E técnica <b>se aprende</b>.`];
      return `
      <span class="badge" data-drop="3">Tem solução</span>
      <h2>${T[0]}</h2>
      <div class="media fill"><img src="${IMG("paty-natal-v1.jpg")}" alt="Paty Domingos sorrindo em frente a uma árvore de Natal dourada" style="object-position: 50% 18%"></div>
      <div class="echo" data-drop="1">${T[1]}</div>`; } },

  { n: 5, center: true, render: () => `
      <h2>Na noite de Natal, quem prepara a mesa da ceia?</h2>
      <div class="opts">
        ${opt("ceia", "eu", "👩‍🍳", "Sou eu, todo ano")}
        ${opt("ceia", "divide", "🤝", "Dividimos entre a família")}
        ${opt("ceia", "outra", "🏡", "Vamos para a casa de outra pessoa")}
      </div>` },

  { n: 6, center: true, render: () => `
      <h2>Alguém já elogiou a sua decoração ou pediu a sua ajuda para <span class="hl-ouro">montar o Natal</span>?</h2>
      <div class="opts">
        ${opt("elogio", "varias", "🙋‍♀️", "Sim, várias vezes")}
        ${opt("elogio", "familia", "👨‍👩‍👧", "Só a família e as amigas")}
        ${opt("elogio", "nunca", "🤔", "Nunca")}
      </div>` },

  /* ================= O NATAL COMO SERVIÇO ================= */
  { n: 0, id: "servico", cta: "CONTINUAR", render: () => {
      const echo = { varias: `Você contou que <b>já pediram a sua ajuda várias vezes</b>. No Natal, esse pedido vira cliente.`, familia: `Você <b>já ajuda a família e as amigas</b>. É o mesmo cuidado, só que pago.`, nunca: `Ninguém pediu ainda? Tudo bem: <b>a técnica se aprende do zero</b>.` }[A.elogio];
      return `
      <span class="badge" data-drop="4">Você sabia?</span>
      <h2>Tem família que <span class="hl-ouro">paga para ter o Natal montado</span></h2>
      <ul class="facts">
        <li><span class="ck">🎄</span><span><b>Montagem da árvore</b> com técnica, do tamanho que a cliente tiver</span></li>
        <li data-drop="3"><span class="ck">🍽️</span><span><b>Mesa posta da ceia</b>, pronta para a noite de Natal</span></li>
        <li data-drop="2"><span class="ck">📦</span><span><b>Desmontagem e organização</b> dos enfeites depois do Dia de Reis (6/1)</span></li>
      </ul>
      ${echo ? `<div class="echo" data-drop="1">${echo}</div>` : ""}
      <div class="media fill"><img src="${IMG("paty-natal-v1.jpg")}" alt="Árvore de Natal dourada montada ao lado de uma poltrona" style="object-position: 50% 30%"></div>`; } },

  { n: 7, center: true, render: () => `
      <h2>Você já recebeu dinheiro por algum serviço de decoração ou organização?</h2>
      <div class="opts">
        ${opt("cobrou", "sim", "💰", "Sim, já cobrei")}
        ${opt("cobrou", "gratis", "🎁", "Já fiz, mas sempre de graça")}
        ${opt("cobrou", "nunca", "🌱", "Nunca fiz para ninguém")}
      </div>` },

  { n: 8, center: true, render: () => `
      <h2>Qual é o seu <span class="hl-ouro">principal objetivo</span> neste Natal?</h2>
      <div class="opts">
        ${opt("objetivo", "casa", "🏠", "Aprender a decorar e organizar o Natal da minha casa")}
        ${opt("objetivo", "renda-extra", "💰", "Descobrir uma oportunidade de renda extra")}
        ${opt("objetivo", "comecar", "🚀", "Começar a trabalhar profissionalmente com organização")}
        ${opt("objetivo", "ampliar", "✨", "Ampliar meus conhecimentos e serviços como personal organizer")}
      </div>` },

  { n: 9, center: true, render: () => `
      <h2>Quanto tempo você teria em dezembro para montar o Natal de outras famílias?</h2>
      <div class="opts">
        ${opt("tempo", "fds", "📅", "Só nos fins de semana")}
        ${opt("tempo", "alguns", "🗓️", "Alguns dias por semana")}
        ${opt("tempo", "muito", "🔥", "Bastante tempo livre")}
        ${opt("tempo", "so-casa", "🏠", "Por enquanto, só quero a minha casa")}
      </div>` },

  /* ================= PROVA ================= */
  { n: 0, id: "paty", cta: "CONTINUAR", render: () => {
      const ponte = A.sit === "diarista" ? `Ela começou <b>exatamente onde você está hoje</b>.` : A.sit === "po" ? `Hoje ela <b>monta o Natal de casas de alto padrão</b>. E vai te mostrar como.` : `Se ela começou do zero, <b>você também pode</b>.`;
      return `
      <h2>A Paty começou como empregada doméstica. <span class="hl-ouro">Hoje é organizadora de alto padrão.</span></h2>
      <div class="media fill"><img src="${IMG("paty-natal-v1.jpg")}" alt="Paty Domingos sorrindo, sentada em uma poltrona ao lado de uma árvore de Natal" style="object-position: 50% 22%"></div>
      <ul class="facts lado" data-drop="2">
        <li><span class="ck">✓</span><span>Mais de <b>11 anos</b> como personal organizer</span></li>
        <li><span class="ck">✓</span><span>Mais de <b>10 mil alunas</b> no Brasil e no exterior</span></li>
      </ul>
      <div class="echo ponte" data-drop="1">${ponte}</div>`; } },

  { n: 0, id: "prova", cta: "CONTINUAR", render: () => `
      <h2>Ela trabalhava em casa de família. <span class="hl-ouro">Hoje é personal organizer.</span></h2>
      <div class="media doc fill"><img src="${IMG("prova-elizete-destaque.jpg")}" alt="Print de mensagem real da Elizete: trabalhava em casa de família, o primeiro dinheiro com a organização veio de uma amiga da patroa e ela seguiu a carreira de personal organizer"></div>
      <div class="echo" data-drop="1">O primeiro trabalho pago da Elizete veio <b>de uma amiga da patroa</b>. Depois ela fez a transição de carreira.</div>
      <p class="legal" data-drop="2">Mensagem real de aluna da Paty Domingos.</p>` },

  /* ================= CAPTURA E RESULTADO ================= */
  { n: 0, id: "analise", auto: true, center: true, render: () => `
      <h2>Analisando as suas respostas…</h2>
      <div class="load"><div class="load-top"><span id="ld-txt">Cruzando o seu jeito de decorar o Natal</span><b id="ld-pct">0%</b></div><div class="load-bar"><i id="ld-bar"></i></div></div>
      <p class="lead" data-drop="1">Estamos montando o seu perfil para este Natal.</p>`,
    onShow: () => loader(["Cruzando o seu jeito de decorar o Natal", "Avaliando o seu tempo em dezembro", "Montando o seu perfil de Natal"]) },

  { n: 0, id: "lead", cta: "VER O MEU RESULTADO", render: () => `
      <h2>O seu perfil de Natal está pronto!</h2>
      <p class="lead">Falta só um passo para ver o seu resultado.</p>
      <form id="lead" class="lead-form" novalidate>
        <label for="f-nome">Primeiro nome<input id="f-nome" name="nome" type="text" autocomplete="given-name" placeholder="Digite seu primeiro nome" value="${esc(A.nome)}"></label>
        <label for="f-email">E-mail<input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Digite seu melhor e-mail" value="${esc(A.email)}"></label>
        <label for="f-whats">WhatsApp<input id="f-whats" name="whats" type="tel" autocomplete="tel-national" inputmode="numeric" placeholder="(11) 99999-9999" value="${esc(A.whats)}"></label>
        <p class="err" id="f-err" role="alert" hidden></p>
        <button type="submit" hidden></button>
      </form>
      <div class="media rosto fill" data-drop="2"><img src="${IMG("paty-natal-quadrada-v2.jpg")}" alt="Paty Domingos sorrindo" style="object-position: 50% 25%"></div>
      <p class="legal" data-drop="1">Ao continuar, você autoriza o uso dos seus dados (nome, e-mail e WhatsApp) para receber o resultado do quiz e comunicações sobre o evento por e-mail e WhatsApp. Você pode cancelar quando quiser.</p>`,
    onShow: () => {
      const w = document.getElementById("f-whats");
      w.addEventListener("input", () => { const d = w.value.replace(/\D/g, "").slice(0, 11); w.value = d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d; });
      document.getElementById("lead").addEventListener("submit", e => { e.preventDefault(); cta.click(); });
    },
    onCta: () => {
      const nome = document.getElementById("f-nome").value.trim();
      const email = document.getElementById("f-email").value.trim();
      const whats = document.getElementById("f-whats").value.replace(/\D/g, "");
      const err = document.getElementById("f-err");
      const fail = (msg, id) => { err.textContent = msg; err.hidden = false; document.getElementById(id).focus(); fit(); return false; };
      if (nome.length < 2) return fail("Digite seu primeiro nome.", "f-nome");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail("Confira o e-mail: falta o @ ou o domínio.", "f-email");
      if (whats.length < 10) return fail("Digite o WhatsApp com DDD.", "f-whats");
      Object.assign(A, { nome: nome.split(" ")[0], email, whats: document.getElementById("f-whats").value });
      enviarLead();
      return true;
    } },

  { n: 0, id: "resultado", cta: "CONTINUAR", render: () => {
      const R = resultado();
      return `
      <p class="hint" style="margin:0">Aqui está o seu resultado…</p>
      <div class="res-card">
        <span class="res-k">${A.nome ? esc(A.nome).toUpperCase() + ", O SEU PERFIL DE NATAL É:" : "O SEU PERFIL DE NATAL É:"}</span>
        <b class="res-nome">${R.perfil[0]}</b>
        <span class="res-frase">${R.perfil[1]}</span>
        <div class="res-meter" data-drop="3"><div class="res-meter-top"><span>${R.meter}</span><b>${R.score}%</b></div><div class="res-bar"><i style="width:${R.score}%"></i></div></div>
      </div>
      <div class="diag ok"><span class="diag-k">✅ O que você já tem</span>${R.tem.map(t => `<p>${t}</p>`).join("")}</div>
      <div class="diag falta" data-drop="2"><span class="diag-k">🔓 O que falta</span><p>${R.falta}</p></div>
      <div class="diag passo"><span class="diag-k">👣 O seu próximo passo</span><p>${R.passo}</p></div>
      <p class="legal" data-drop="1">Perfil calculado a partir das suas respostas.</p>`; } },

  /* ================= CONVITE (rola; botão fixo) ================= */
  { n: 0, id: "convite", scroll: true, cta: "GARANTIR MEU INGRESSO · R$ 19,90", render: () => {
      const nome = esc(A.nome || "");
      const renda = A.objetivo !== "casa";
      return `
      <img class="q-logo sm" src="${IMG("logo-natal-encanta.webp")}" width="620" height="401" alt="Natal que Encanta e Vende">
      <h1 class="cv-h1">${nome ? nome + ", o seu" : "O seu"} próximo passo é <em>ao vivo comigo</em></h1>
      <div class="cv-when"><span>Sábado, 31/10</span><i aria-hidden="true"></i><b>a partir das 14h30</b></div>
      <p class="cv-sub">Ao vivo pelo YouTube · do celular ou do computador</p>
      <div class="cv-ph"><img src="${IMG("paty-natal-v1.jpg")}" alt="Paty Domingos sentada em uma poltrona ao lado de uma árvore de Natal dourada"></div>
      <p class="cv-txt">Ao vivo, vou te ensinar a montar uma <b>árvore de Natal com efeito de vitrine</b>, adaptando as técnicas ao tamanho da sua árvore, e a preparar uma <b>mesa posta natalina que encanta em cada detalhe</b>, seja para sua família ou para suas clientes. Você também vai aprender a <b>desmontar e guardar os enfeites</b> com cuidado.${renda ? ` E ainda vou te mostrar <b>quanto cobrar para montar o Natal das suas clientes</b>.` : ""}</p>
      <ul class="cv-learn">
        <li class="${A.dor === "vazia" ? "hot" : ""}"><i>🎄</i>Montagem da árvore com técnica${A.dor === "vazia" ? "<em>resolve a sua árvore vazia</em>" : ""}</li>
        <li class="${A.dor === "mesa" ? "hot" : ""}"><i>🍽️</i>Mesa posta natalina${A.dor === "mesa" ? "<em>resolve a sua mesa simples</em>" : ""}</li>
        <li class="${A.dor === "guardar" ? "hot" : ""}"><i>📦</i>Desmontagem e conservação${A.dor === "guardar" ? "<em>resolve os enfeites quebrados</em>" : ""}</li>
        <li class="${renda ? "hot" : ""}"><i>💰</i>Como cobrar por esse serviço${renda ? "<em>para o seu objetivo</em>" : ""}</li>
      </ul>
      <div class="cv-price">
        <small>Ingresso · Natal que Encanta e Vende</small>
        <b>R$ 19,90</b>
        <p class="cv-cd" data-cd>R$ 19,90 até <b>sexta, 23h59</b> · faltam <b data-t>…</b></p>
      </div>
      <p class="cv-grav">Não pode assistir no sábado? No checkout você pode garantir a <b>gravação, com acesso por 1 ano</b>.</p>
      <h2 class="cv-h2">Depoimentos reais de alunas da Paty Domingos</h2>
      <div class="cv-deps">
        <figure><img src="${IMG("prova-elizete-destaque.jpg")}" alt="Print de mensagem real da Elizete" loading="lazy"><figcaption><b>Elizete</b> · de casa de família à carreira de personal organizer</figcaption></figure>
        <figure><img src="${IMG("prova-wa6.jpg")}" alt="Print de mensagem real da Claudia" loading="lazy"><figcaption><b>Claudia</b> · pensou em desistir e fechou um projeto de R$ 10 mil</figcaption></figure>
        <figure><img src="${IMG("prova-dep2.jpg")}" alt="Print de mensagem real da Mary" loading="lazy"><figcaption><b>Mary</b> · "eu era a menos indicada", pagou o curso no 1º projeto</figcaption></figure>
      </div>
      <p class="cv-sw">arraste para o lado →</p>`; },
    onShow: () => {
      const box = app.querySelector("[data-cd]"), t = box.querySelector("[data-t]");
      const dois = n => (n < 10 ? "0" : "") + n;
      (function tick() {
        if (!document.body.contains(box)) return;
        const r = LOTE_FIM - Date.now();
        if (r <= 0) { box.hidden = true; return; }
        const d = Math.floor(r / 864e5);
        t.textContent = (d ? d + "d " : "") + dois(Math.floor(r / 36e5) % 24) + "h " + dois(Math.floor(r / 6e4) % 60) + "min " + dois(Math.floor(r / 1e3) % 60) + "s";
        setTimeout(tick, 1000);
      })();
    },
    onCta: () => { irParaCompra(); return false; } }
];

/* componentes */
function pic(key, val, label, src) {
  return `<button type="button" class="pic${A[key] === val ? " on" : ""}" data-k="${key}" data-v="${val}"><span class="ph-img"><img src="${src}" alt=""></span><span class="lbl">${label}</span></button>`;
}
function opt(key, val, em, label, small) {
  return `<button type="button" class="opt${A[key] === val ? " on" : ""}" data-k="${key}" data-v="${val}"><span class="em">${em}</span><span class="tx">${label}${small ? `<small data-drop="1">${small}</small>` : ""}</span></button>`;
}
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  ].filter(Boolean).slice(0, 2);

/* lead: envia para o webhook (se configurado) assim que a pessoa preenche */
function enviarLead() {
  if (!WEBHOOK_URL || A._enviado) return;
  A._enviado = true;
  const utms = {};
  new URLSearchParams(location.search).forEach((v, k) => { if (/^utm_|^src$|^sck$/.test(k)) utms[k] = v; });
  const resp = {}; Object.keys(A).forEach(k => { if (!/^(_|nome|email|whats)/.test(k)) resp[k] = A[k]; });
  try { fetch(WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true, body: JSON.stringify({ origem: "quiz-natal", nome: A.nome, email: A.email, telefone: (A.whats || "").replace(/\D/g, ""), respostas: resp, utms, data: new Date().toISOString() }) }); } catch (e) {}
}
/* botão final: checkout com os dados do lead; sem checkout configurado, vai para a página de vendas */
function irParaCompra() {
  const q = new URLSearchParams(location.search);
  const u = new URL(CHECKOUT_URL || VENDAS_URL, location.href);
  q.forEach((v, k) => { if (/^utm_|^src$|^sck$/.test(k) && !u.searchParams.has(k)) u.searchParams.set(k, v); });
  if (A.objetivo && !u.searchParams.has("utm_term")) u.searchParams.set("utm_term", "objetivo-" + A.objetivo);
  if (!u.searchParams.has("utm_content")) u.searchParams.set("utm_content", "quiz-natal");
  if (CHECKOUT_URL) { u.searchParams.set("name", A.nome || ""); u.searchParams.set("email", A.email || ""); u.searchParams.set("phone", (A.whats || "").replace(/\D/g, "")); }
  location.href = u.toString();
}

/* carregamento: 25 passos de 4% a cada 120 ms = 3 s */
function loader(steps) {
  let p = 0;
  const tick = setInterval(() => {
    p = Math.min(100, p + 4);
    const b = document.getElementById("ld-bar");
    if (!b) return clearInterval(tick);
    b.style.width = p + "%";
    document.getElementById("ld-pct").textContent = p + "%";
    document.getElementById("ld-txt").textContent = steps[Math.min(steps.length - 1, Math.floor(p / (100 / steps.length + 0.01)))];
    if (p >= 100) { clearInterval(tick); setTimeout(next, 200); }
  }, 120);
}

/* pré-carregamento das fotos, 4 por vez */
const IMGS = ["avatar-18-29.jpg", "avatar-29-39.jpg", "avatar-39-49-v2.jpg", "avatar-50.jpg", "paty-natal-v1.jpg", "paty-natal-quadrada-v2.jpg", "prova-elizete-destaque.jpg", "prova-wa6.jpg", "prova-dep2.jpg"].map(IMG);
const preloaded = new Set(), keep = [], queue = [];
let busy = 0;
function pump() {
  while (busy < 4 && queue.length) {
    const src = queue.shift(); busy++;
    const i = new Image(); i.decoding = "async"; keep.push(i);
    i.onload = i.onerror = () => { busy--; if (i.decode) i.decode().catch(() => {}); pump(); };
    i.src = src;
  }
}
function preloadImgs(list) { list.forEach(src => { if (preloaded.has(src)) return; preloaded.add(src); queue.push(src); }); pump(); }
setTimeout(() => preloadImgs(IMGS), 0);

/* regra: a tela tem que caber sem rolar */
function fit() {
  const sec = app.querySelector(".screen");
  if (!sec || sec.classList.contains("scroll")) return;
  sec.querySelectorAll("[data-drop]").forEach(el => el.hidden = false);
  const drops = [...sec.querySelectorAll("[data-drop]")].sort((a, b) => b.dataset.drop - a.dataset.drop);
  const inner = () => [...sec.querySelectorAll("[data-fit]")].some(el => el.scrollHeight > el.clientHeight + 1);
  while ((sec.scrollHeight > sec.clientHeight || inner()) && drops.length) drops.shift().hidden = true;
}

const app = document.getElementById("app");
const foot = document.getElementById("foot");
const cta = document.getElementById("cta");
const back = document.getElementById("back");
let cur = 0;

S.forEach((x, i) => { x.n = i + 1; });
const TOTAL = S.length;
function show(i, push = true) {
  if (push && cur !== i) hist.push(cur);
  cur = i;
  const s = S[i];
  app.innerHTML = `<section class="screen${s.center ? " center-y" : ""}${s.scroll ? " scroll" : ""}">${s.render()}</section>`;
  document.getElementById("prog").style.width = Math.min(100, (s.n / TOTAL) * 100) + "%";
  back.disabled = hist.length === 0;
  foot.hidden = !s.cta;
  if (s.cta) cta.textContent = s.cta;
  fit();
  if (s.onShow) s.onShow();
  app.querySelectorAll("img").forEach(img => img.complete || img.addEventListener("load", fit, { once: true }));
}
function next() { if (cur < S.length - 1) show(cur + 1); }

app.addEventListener("click", e => {
  const single = e.target.closest("[data-k]");
  if (!single) return;
  A[single.dataset.k] = single.dataset.v;
  app.querySelectorAll(`[data-k="${single.dataset.k}"]`).forEach(b => b.classList.toggle("on", b === single));
  setTimeout(next, 180);
});
cta.addEventListener("click", () => { const s = S[cur]; if (s.onCta && !s.onCta()) return; next(); });
back.addEventListener("click", () => { let i = hist.pop(); while (i !== undefined && S[i].auto && hist.length) i = hist.pop(); if (i !== undefined) show(i, false); });
addEventListener("resize", fit);
if (document.fonts) document.fonts.ready.then(fit);
